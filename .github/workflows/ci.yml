name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          mkdir -p .build/ci
          swiftc -swift-version 5 Sources/Core/*.swift Tests/main.swift -o .build/ci/tests -lsqlite3
          ./.build/ci/tests
